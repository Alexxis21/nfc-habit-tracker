spring:
  application:
    name: habitapp-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/habitapp
    username: postgres
    password: postgres

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    # Flyway jest teraz właścicielem schematu (migracje w db/migration).
    # 'validate' oznacza: Hibernate przy starcie sprawdza, czy encje @Entity
    # zgadzają się ze schematem stworzonym przez Flyway, ale sam niczego
    # nie tworzy ani nie zmienia w bazie.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
