spring:
  application:
    name: habitapp-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/habitapp
    username: postgres
    password: postgres

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: "zmien-mnie-na-dlugi-losowy-sekret-min-32-znaki-produkcyjnie-z-env"
    expiration-ms: 86400000 # 24h
  nfc:
    scan-url: "habitapp://scan"
